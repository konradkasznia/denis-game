<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="robots" content="noindex" />
    <title>Nowe hasło — Denis Impulsywni Live</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b0b12;
        color: #f2f2f5;
        font-family: "Roboto", "Trebuchet MS", system-ui, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #15151f;
        border: 1px solid #26263a;
        border-radius: 18px;
        padding: 28px 24px 26px;
      }
      h1 { margin: 0 0 6px; font-size: 22px; color: #ffcf3f; }
      p { margin: 0 0 18px; line-height: 1.55; color: #c9c9d4; font-size: 14px; }
      label { display: block; font-size: 13px; margin: 14px 0 6px; color: #a9a9b8; }
      input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 11px;
        border: 1px solid #34344a;
        background: #0f0f18;
        color: #fff;
        font-size: 16px;
      }
      input:focus { outline: 2px solid #ffcf3f; outline-offset: 1px; }
      button {
        width: 100%;
        margin-top: 20px;
        padding: 14px 16px;
        border: 0;
        border-radius: 12px;
        background: #ffcf3f;
        color: #1a1a1a;
        font-weight: 800;
        font-size: 16px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .msg { margin-top: 16px; font-size: 14px; line-height: 1.5; }
      .msg.err { color: #ff8080; }
      .msg.ok { color: #7fdc9a; }
      a.back { display: inline-block; margin-top: 18px; color: #ffcf3f; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Nowe hasło</h1>
      <p>Ustaw nowe hasło do konta w grze Denis Impulsywni Live. Minimum 8 znaków.</p>
      <form id="form">
        <label for="p1">Nowe hasło</label>
        <input id="p1" type="password" autocomplete="new-password" minlength="8" required />
        <label for="p2">Powtórz hasło</label>
        <input id="p2" type="password" autocomplete="new-password" minlength="8" required />
        <button id="submit" type="submit">Zapisz nowe hasło</button>
      </form>
      <div id="msg" class="msg" hidden></div>
      <a class="back" href="/">← Wróć do gry</a>
    </div>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var token = params.get("token") || "";
        var form = document.getElementById("form");
        var msg = document.getElementById("msg");
        var btn = document.getElementById("submit");

        function show(text, kind) {
          msg.textContent = text;
          msg.className = "msg " + (kind || "");
          msg.hidden = false;
        }

        if (!token) {
          form.hidden = true;
          show("Brak tokenu w adresie. Otwórz link z e-maila jeszcze raz.", "err");
          return;
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var p1 = document.getElementById("p1").value;
          var p2 = document.getElementById("p2").value;
          if (p1.length < 8) return show("Hasło musi mieć co najmniej 8 znaków.", "err");
          if (p1 !== p2) return show("Hasła nie są takie same.", "err");
          btn.disabled = true;
          show("Zapisuję…", "");
          fetch("/api/auth/reset", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ token: token, password: p1 }),
          })
            .then(function (r) {
              return r.json().then(function (d) {
                return { ok: r.ok, d: d };
              });
            })
            .then(function (res) {
              if (res.ok && res.d.ok) {
                form.hidden = true;
                show("Hasło zmienione. Możesz zalogować się w grze nowym hasłem.", "ok");
              } else {
                btn.disabled = false;
                show(res.d.error || "Nie udało się zmienić hasła.", "err");
              }
            })
            .catch(function () {
              btn.disabled = false;
              show("Brak połączenia z serwerem. Spróbuj ponownie.", "err");
            });
        });
      })();
    </script>
  </body>
</html>
