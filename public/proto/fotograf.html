<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fotograf weselny</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Great+Vibes&family=Manrope:wght@400;600;800&display=swap">
<style>
/* jeden ekran gry: kanwa 9:16 wpisana w ekran, nakładki startu i albumu */
:root { --bg: #170b14; --fg: #f6e9ef; --muted: #b99aac; --gold: #f2c45a; --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif; --body: "Manrope", system-ui, sans-serif; color-scheme: dark; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); display: flex; align-items: center; justify-content: center; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); box-sizing: border-box; overflow: hidden; touch-action: manipulation; }
.screen { position: relative; height: 100%; max-height: 1280px; aspect-ratio: 9 / 16; max-width: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 22px; background: rgba(14,6,12,.85); }
.overlay h2 { font-family: var(--display); font-weight: 900; font-size: 46px; line-height: .95; margin: 0; text-transform: uppercase; color: var(--gold); }
.overlay p { margin: 0; max-width: 30ch; font-size: 14px; line-height: 1.5; }
.btn { font-family: var(--display); font-weight: 900; font-size: 24px; letter-spacing: .06em; text-transform: uppercase; color: #2a1206; background: linear-gradient(#ffe08a, #f2b13a); border: 0; border-radius: 14px; padding: 12px 34px; cursor: pointer; box-shadow: 0 4px 0 #a8661b; text-decoration: none; }
.album { position: absolute; inset: 0; background: #1d0f1a; overflow-y: auto; padding: 18px 14px 22px; display: flex; flex-direction: column; gap: 12px; }
.album header { text-align: center; }
.album h3 { font-family: var(--display); font-weight: 900; font-size: 34px; margin: 0; color: var(--gold); text-transform: uppercase; }
.album .sum { color: var(--muted); font-size: 13px; }
.stars { font-size: 28px; letter-spacing: 6px; color: var(--gold); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.pol { background: #fbf6ee; padding: 5px 5px 4px; border-radius: 2px; box-shadow: 0 3px 8px rgba(0,0,0,.45); color: #2b1a22; transform: rotate(var(--r)); margin: 0; }
.pol img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.pol b { display: block; font-size: 10px; line-height: 1.2; margin-top: 4px; font-weight: 800; }
.pol i { display: block; font-style: normal; font-size: 9px; font-weight: 600; color: #8b5a6e; }
.pol.blur img { filter: blur(2px) saturate(.6); }
.pol.miss { background: #3a2335; color: var(--muted); display: flex; flex-direction: column; justify-content: center; text-align: center; min-height: 100%; }
.pol.miss b { color: var(--muted); }
.album .btn { align-self: center; margin-top: 6px; }
</style>
</head>
<body>
<div class="screen" id="screen">
  <canvas id="cv" aria-label="Runda Fotograf weselny"></canvas>
  <div class="overlay" id="gate">
    <h2>Fotograf<br>weselny</h2>
    <p id="gateMsg">Sprawdzam dostęp…</p>
    <a class="btn" id="gateBtn" href="/" hidden>Zaloguj się w grze</a>
  </div>
  <div class="overlay" id="intro" hidden>
    <h2>Fotograf<br>weselny</h2>
    <p>Sala pełna gości. Gdzieś w tłumie zaraz wydarzy się coś, czego para młoda nie może przegapić. Wypatrz to i zrób zdjęcie w najlepszym momencie.</p>
    <p style="color:var(--muted);font-size:13px">13 wyjątkowych chwil, każda tylko raz. Klisza: 20 klatek.</p>
    <button class="btn" id="start">Zaczynamy</button>
  </div>
  <div class="album" id="album" hidden></div>
</div>
<script src="fotograf-loader.js"></script>
</body>
</html>
