name: Wygeneruj klucz RELEASE (jednorazowo)

# Uruchom RĘCZNIE (Actions -> ten workflow -> Run workflow) TYLKO RAZ, żeby
# założyć klucz podpisujący do Google Play. Wynik (plik .jks + hasła) trafia
# do artefaktu do pobrania — NIGDY do repo i NIGDY do logów tego workflow.
#
# Po pobraniu:
#   1. Zapisz plik .jks w bezpiecznym miejscu (menedżer haseł / katalog
#      sekretów) — bez niego nie da się bez pomocy Google podpisać kolejnej
#      aktualizacji tym samym kluczem.
#   2. Dodaj 4 sekrety repo (Settings -> Secrets and variables -> Actions ->
#      New repository secret), z plikiem release.env z artefaktu:
#        RELEASE_KEYSTORE_BASE64   (zawartość release.jks.b64 - CAŁY tekst)
#        RELEASE_KEYSTORE_PASSWORD
#        RELEASE_KEY_ALIAS
#        RELEASE_KEY_PASSWORD
#   3. Usuń artefakt z tego workflow run (Actions -> ten run -> kosz przy
#      artefakcie) po zapisaniu wszystkiego bezpiecznie.
#   4. Ten plik workflow możesz potem skasować (jednorazowy).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Generuj keystore + hasła
        run: |
          set -e
          STORE_PW=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          KEY_PW=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          ALIAS="denis-release"

          keytool -genkeypair -v -keystore release.jks \
            -storepass "$STORE_PW" -keypass "$KEY_PW" -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Denis Impulsywni Live, O=Impulsywni, C=PL"

          base64 -w0 release.jks > release.jks.b64

          {
            echo "RELEASE_KEYSTORE_PASSWORD=$STORE_PW"
            echo "RELEASE_KEY_ALIAS=$ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PW"
          } > release.env

          echo "Gotowe — hasła i alias w release.env, keystore (base64) w release.jks.b64"

      - uses: actions/upload-artifact@v5
        with:
          name: denis-release-keystore-SECRET
          path: |
            release.jks.b64
            release.env
          retention-days: 7
          if-no-files-found: error
