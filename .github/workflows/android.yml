name: Android APK (debug)

# Buduje testowy APK w chmurze (bez Maca / bez lokalnego Android SDK).
# Efekt: artefakt do pobrania z zakładki Actions + stały prerelease
# „android-latest" z plikiem .apk (wygodny bezpośredni link na telefon).

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "public/regulamin.html"
      - "public/polityka-prywatnosci.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalacja zależności
        run: npm ci

      - name: Build web (dist/) — backend na Vercelu (apka woła cross-origin)
        run: npm run build
        env:
          VITE_API_BASE: https://denis-game.vercel.app
          VITE_ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # third-party akcje przypięte do SHA (tagi są mutowalne)
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Pakiety Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || \
            sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      # Stały keystore debug — bez tego każdy build ma inny podpis i Android
      # odmawia instalacji nowego APK na starym. Generujemy RAZ i zapisujemy w repo.
      # Jeśli commit-back się nie uda (branch chroniony itp.) — build i tak leci,
      # keystore jest w runnerze; następny build wygeneruje go ponownie.
      - name: Stały keystore debug
        run: |
          KS=android/keystore/denis-debug.jks
          if [ -f "$KS" ]; then
            echo "keystore już w repo — używam go"
          else
            mkdir -p android/keystore
            keytool -genkeypair -v -keystore "$KS" \
              -storepass denisdebug -keypass denisdebug -alias denis \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Denis Impulsywni Live, O=Impulsywni, C=PL"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$KS"
            git commit -m "chore(android): staly keystore debug [skip ci]" || true
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "commit-back keystore nieudany — build leci dalej"
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build APK (debug)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Nazwa pliku
        run: cp android/app/build/outputs/apk/debug/app-debug.apk denis-impulsywni-live-debug.apk

      - uses: actions/upload-artifact@v5
        with:
          name: denis-android-debug-apk
          path: denis-impulsywni-live-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publikacja do prerelease „android-latest"
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: android-latest
          name: Android (debug) — najnowszy build
          prerelease: true
          files: denis-impulsywni-live-debug.apk
          body: |
            Testowy build APK (debug) — instalacja spoza sklepu.
            Na telefonie włącz „Instaluj nieznane aplikacje" dla przeglądarki / menedżera plików.
            APK ładuje żywą wersję z https://denis-game.vercel.app (potrzebny internet).
            Commit: ${{ github.sha }}
