apply plugin: 'com.android.application'

// Stały keystore debug (w repo). Bez tego każdy build CI generuje losowy klucz
// debug → Android odmawia instalacji nowego APK na starym ("nie można
// zainstalować aplikacji"). Z jednym kluczem aktualizacja działa bez odinstalowania.
def stableKeystore = file('../keystore/denis-debug.jks')

// Klucz RELEASE (do Google Play) — NIGDY nie trzymamy w repo (w przeciwieństwie
// do debug keystore'a, który jest jawny i nieważny bezpieczeństwowo). W CI
// (.github/workflows/android-release.yml) workflow dekoduje sekret
// RELEASE_KEYSTORE_BASE64 do pliku i podaje ścieżkę/hasła zmiennymi
// środowiskowymi. Lokalnie / w zwykłym buildzie debug tych zmiennych nie ma —
// signingConfig „release" po prostu zostaje nieużywany.
def releaseKeystorePath = System.getenv('RELEASE_KEYSTORE_PATH')
def hasReleaseSigning = releaseKeystorePath != null && file(releaseKeystorePath).exists()

// versionCode MUSI rosnąć z każdym uploadem do Play Console (też testy
// wewnętrzne). Liczymy go automatycznie z liczby commitów — nigdy nie trzeba
// go ręcznie podbijać ani pilnować, żeby się nie cofnął.
def gitCommitCount = {
    try {
        def proc = ['git', 'rev-list', '--count', 'HEAD'].execute(null, rootDir)
        proc.waitFor()
        return proc.exitValue() == 0 ? proc.text.trim().toInteger() : 1
    } catch (ignored) {
        return 1 // brak git (np. źródło z zipa) — nie wysyłane wtedy na Play i tak
    }
}()

android {
    namespace = "pl.impulsywni.denis"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.impulsywni.denis"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode gitCommitCount
        // Synchronizuj ręcznie z APP_VERSION w src/game.ts i VERSION w
        // api/app-version.ts przy każdym realnym wydaniu (patrz appUpdate.ts —
        // od tego zależy, czy graczom pokaże się modal "dostępna aktualizacja").
        versionName "0.9.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Nadpisujemy WBUDOWANY signingConfig `debug` naszym stałym keystore z repo,
    // jeśli plik istnieje (w CI generuje go krok workflow). Bez pliku (lokalny
    // dev) AGP użyje swojego automatycznego ~/.android/debug.keystore.
    signingConfigs {
        debug {
            if (stableKeystore.exists()) {
                storeFile stableKeystore
                storeType 'PKCS12' // keytool z JDK 21 tworzy PKCS12 mimo rozszerzenia .jks
                storePassword 'denisdebug'
                keyAlias 'denis'
                keyPassword 'denisdebug'
            }
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storeType 'PKCS12'
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
